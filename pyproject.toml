[project]
name = "reader-api"
version = "0.1.0"
description = "Shared backend API for reader web and reader-app mobile clients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy[asyncio]>=2.0.43",
  "greenlet>=3.0.0",
  "asyncpg>=0.30.0",
  "motor>=3.7.1",
  "python-jose[cryptography]>=3.5.0",
  "google-auth>=2.40.3",
  "requests>=2.32.5",
  "pydantic-settings>=2.10.1",
  # mod routes deps
  "boto3>=1.35.0",
  "httpx>=0.27.0",
  "ebooklib>=0.18",
  "html2text>=2024.2.26",
  "python-slugify>=8.0.4",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
  "ruff>=0.12.11",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
package = false
